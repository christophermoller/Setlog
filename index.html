<style>
/* Layout: one phone column. A scrolling screen, then an optional minimized-workout bar and the tab bar; sheets slide up over everything. Each theme is a token set on :root[data-app-theme]. */
:root{--bg:#2F4F57;--card:#385C64;--card2:#44797D;--text:#EDF7FE;--muted:#C9E1F3;--accent:#9DE5E1;--accent-text:#9DE5E1;--on-accent:#2F4F57;--dim:#6E979C;--line:#44797D;--back:#14252A;color-scheme:dark}
:root[data-app-theme="black"]{--bg:#0E0E0E;--card:#1C1C1E;--card2:#2A2A2D;--text:#FFFFFF;--muted:#A1A1A6;--accent:#8AF921;--accent-text:#8AF921;--on-accent:#0E0E0E;--dim:#4A4A4E;--line:#2A2A2D;--back:#000000;color-scheme:dark}
:root[data-app-theme="forest"]{--bg:#142F1E;--card:#1F432B;--card2:#316339;--text:#F7FEE9;--muted:#B4CDB6;--accent:#B1E556;--accent-text:#B1E556;--on-accent:#142F1E;--dim:#4F7A56;--line:#316339;--back:#07140B;color-scheme:dark}
:root[data-app-theme="oxblood"]{--bg:#2A0D12;--card:#3A141B;--card2:#4E1C25;--text:#F8EDE6;--muted:#D8B9B2;--accent:#F2E3D5;--accent-text:#E8C9B0;--on-accent:#2A0D12;--dim:#7A4A52;--line:#4E1C25;--back:#12050A;color-scheme:dark}
:root[data-app-theme="graphite"]{--bg:#141415;--card:#1B1B1D;--card2:#262628;--text:#EDEDED;--muted:#A1A1A6;--accent:#D4D4D8;--accent-text:#C4C4C9;--on-accent:#141415;--dim:#4A4A4E;--line:#2A2A2C;--back:#000000;--glow:#3A3A3E;--glow-op:.5;color-scheme:dark}
:root[data-app-theme="dusk"]{--bg:#262A35;--card:#2F3441;--card2:#3A404F;--text:#F3F0F2;--muted:#A1A6B4;--accent:#EC8E7C;--accent-text:#F0A190;--on-accent:#2A1F26;--dim:#5A6070;--line:#3A404F;--back:#14161C;--glow:#9E4F84;--glow-op:.55;--g-grad:linear-gradient(90deg,color-mix(in srgb,#9E4F84 70%,transparent),color-mix(in srgb,#EC8E7C 70%,transparent));color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
#aura{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;opacity:0;transition:opacity .6s ease}
#aura.on{opacity:1}
#tabs,#toast,#mini{position:relative;z-index:1}
#aura i{position:absolute;border-radius:50%;will-change:transform}
#aura i:nth-child(1){width:140%;height:70%;left:-45%;top:-25%;background:radial-gradient(closest-side,var(--accent),transparent);opacity:.24;animation:au1 26s ease-in-out infinite alternate}
#aura i:nth-child(2){width:130%;height:65%;right:-50%;top:15%;background:radial-gradient(closest-side,var(--glow,var(--card2)),transparent);opacity:var(--glow-op,.7);animation:au2 32s ease-in-out infinite alternate}
#aura i:nth-child(3){width:120%;height:60%;left:-15%;bottom:-25%;background:radial-gradient(closest-side,var(--accent),transparent);opacity:.14;animation:au3 38s ease-in-out infinite alternate}
@keyframes au1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(18%,10%) scale(1.15)}100%{transform:translate(35%,4%) scale(.95)}}
@keyframes au2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-22%,12%) scale(1.1)}100%{transform:translate(-10%,-14%) scale(1.2)}}
@keyframes au3{0%{transform:translate(0,0) scale(1.1)}50%{transform:translate(20%,-16%) scale(.9)}100%{transform:translate(-8%,-6%) scale(1.05)}}
@media (prefers-reduced-motion: reduce){#aura i{animation:none}}
#app.glass .card{background:color-mix(in srgb,var(--card) 80%,transparent)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative}
#screen{position:relative;z-index:1;flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.scr{flex:1 0 auto;display:flex;flex-direction:column;gap:18px;padding-block:20px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.g2{gap:2px}.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}
.minw0{min-width:0}.f1{flex:1;min-width:0}
.mt-auto{margin-top:auto}
.center{align-items:center;text-align:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
.b{font-weight:700}
.sep{display:inline-block;width:1px;height:.8em;background:var(--dim);margin:0 8px;vertical-align:-1px}
.h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.h1.xl{font-size:40px}
.h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent-text)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin:0 4px}
.brand{font-size:17px;font-weight:700;letter-spacing:-.01em}
.card{background:var(--card);border-radius:20px}
.pad{padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;min-height:48px;padding:0 16px;background:var(--card2);color:var(--text);font-weight:700;font-size:15px;text-decoration:none}
.btn.sm{min-height:40px;border-radius:12px;padding:0 12px;font-size:14px;background:var(--card)}
.btn.primary{background:var(--accent);color:var(--on-accent);min-height:58px;font-size:18px}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--muted);padding:0 8px;min-height:36px;font-size:14px}
.btn.light{background:var(--text);color:var(--bg)}
.iconbtn{width:44px;height:44px;flex:none;border:0;border-radius:22px;background:var(--card);color:var(--text);display:inline-flex;align-items:center;justify-content:center}
.iconbtn.sq{border-radius:12px;width:40px;height:40px}
.backlink{display:inline-flex;align-items:center;gap:4px;min-height:44px;border:0;background:none;padding:0 12px 0 0;color:var(--text);font-weight:700;font-size:15px;align-self:flex-start}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:0 14px;border:0;border-radius:16px;background:var(--card);color:var(--text);text-align:left}
.item .chev{color:var(--muted);flex:none}
.tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-text)}
.seg{display:grid;gap:4px;background:var(--card);border-radius:12px;padding:4px}
.seg button{border:0;border-radius:9px;min-height:40px;background:transparent;font-weight:700;font-size:14px;padding:0 2px;color:var(--text)}
.seg button.on{background:var(--text);color:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chips.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}
.chip{flex:none;border:0;border-radius:999px;min-height:40px;padding:0 14px;background:var(--card);font-weight:700;font-size:15px;color:var(--text)}
.chip.on{background:var(--accent);color:var(--on-accent)}
.starbtn{border:0;background:var(--card);color:var(--muted);height:34px;min-width:34px;border-radius:17px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 9px;font-weight:700;font-size:14px}
.starbtn.on{background:var(--accent);color:var(--on-accent)}
.stari{display:inline-flex;color:var(--accent-text)}
@media (prefers-reduced-motion: no-preference){.starbtn.pop svg{animation:pop .45s cubic-bezier(.22,1,.36,1)}}
.ta{width:100%;min-height:120px;border:0;border-radius:14px;background:var(--bg);color:var(--text);font:inherit;font-size:16px;line-height:1.45;padding:12px 14px;resize:none;outline:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.ta:focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
.notep{align-self:flex-start;max-width:100%;border:0;background:none;padding:0;color:var(--muted);font-size:14px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.noteon{background:var(--accent)!important;color:var(--on-accent)}
.notes{display:flex;flex-direction:column;border-radius:16px;background:var(--card);overflow:hidden}
.nsec{display:flex;flex-direction:column;gap:4px;border:0;background:none;color:var(--text);text-align:left;padding:12px 14px}
.nsec + .nsec{box-shadow:inset 0 1px 0 var(--line)}
.nsec b{font-size:15px}
.nsec span{font-size:15px;color:var(--muted);white-space:pre-wrap;line-height:1.45}
.ccard{display:flex;align-items:center;gap:12px;width:100%;border:0;color:var(--text);text-align:left;padding:14px 16px;border-radius:20px;min-height:64px}
.cico{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--card2);color:var(--accent-text)}
.cplus{width:32px;height:32px;flex:none;border-radius:16px;display:grid;place-items:center;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.ccal .cd.off{opacity:.3}
.ccal .cd.t>span{background:none;color:var(--accent-text)}
.ccal .cd.sel>span{width:30px;height:30px;border-radius:50%;justify-content:center;background:var(--text);color:var(--bg);font-weight:700}
.cgrid{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.cfield{width:100%;min-width:0;min-height:52px;border:0;border-radius:14px;background:var(--card2);color:var(--text);font:inherit;font-size:20px;font-weight:600;padding:0 14px;outline:none}
.cfield:focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cfield::placeholder{color:var(--muted);font-weight:500;font-size:16px}
.datechip{position:relative;display:inline-flex;align-items:center;overflow:hidden}
.datechip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;font-size:16px}
.eqadd{display:flex;gap:8px;align-items:stretch}
.eqadd input{flex:1;min-width:0;min-height:52px;border:0;border-radius:14px;background:var(--card);color:var(--text);font:inherit;font-size:16px;padding:0 14px;outline:none;box-shadow:inset 0 0 0 1.5px var(--accent)}
.eqadd .btn{min-height:52px;padding:0 20px}
.opt.eqplus{color:var(--muted);gap:12px}
.opt.eqplus b{color:var(--text);font-weight:500}
.eqico{width:22px;height:22px;display:grid;place-items:center}
.chip.eqchip{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:0 12px;background:none;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--text)}
.search{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-radius:14px;background:var(--card);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:16px;outline:none}
.sel{min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:var(--card);color:var(--text);font-size:15px;font-weight:700;align-self:flex-start;max-width:100%}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:4px}
.stepper button{border:0;border-radius:10px;min-height:48px;background:var(--card2);color:var(--text);font-size:22px}
.stepper input,.stepper output{min-width:0;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);text-align:center;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center}
.stepper output{border:0;background:transparent}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* workout */
.whead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.ovbar{display:flex;align-items:center;gap:14px;min-height:54px;padding:0 14px;border:0;border-radius:16px;background:var(--card);color:var(--text);text-align:left;width:100%}
.segs{display:grid;gap:4px;margin-top:8px}
.segs i{height:4px;border-radius:2px;background:var(--card2)}
.segs i.d{background:var(--accent)}.segs i.c{background:var(--text)}
.rest{background:var(--card);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
@keyframes restIn{from{max-height:0;opacity:0;padding-top:0;padding-bottom:0;margin-top:-18px}to{max-height:320px;opacity:1}}
@keyframes restRe{0%{transform:scale(.97);opacity:.6}100%{transform:none;opacity:1}}
.rest.rest-re{animation:restRe .3s cubic-bezier(.22,1,.36,1)}
.rest.rest-in{overflow:hidden;animation:restIn .3s cubic-bezier(.22,1,.36,1)}
.rest .bar{background:var(--bg)}
.rest.mini{align-items:stretch;gap:10px;padding:10px 10px 12px 16px;border-radius:18px}
.rest.mini .mt{font-size:30px;line-height:1;letter-spacing:-.02em}
.rest.mini .bar{height:6px;margin-right:6px}
.rbs{display:flex;gap:4px}
.rbs button{width:42px;height:38px;border:0;border-radius:10px;background:var(--card2);color:var(--text);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0}
.rest.closing{overflow:hidden;transition:height .28s cubic-bezier(.22,1,.36,1),padding .28s cubic-bezier(.22,1,.36,1),margin .28s cubic-bezier(.22,1,.36,1),opacity .2s ease}
.rest-time{font-size:64px;font-weight:700;line-height:1;text-align:center;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.ctl4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ctl4 button{border:0;border-radius:12px;min-height:46px;background:var(--card2);color:var(--text);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.rest.idle{flex-direction:row;align-items:center;justify-content:space-between;padding:12px 16px}
.actbox{background:var(--card);border-radius:24px;padding:14px 10px 6px}
.actbox .sw-wrap .item{background:var(--card2)}
.actbox .sw-wrap .sw-row{border-radius:16px}
.dexs .dex{padding:14px 0}
.dexs .dex + .dex{box-shadow:inset 0 1px 0 var(--line)}
.dexs .dex:first-child{padding-top:4px}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding-bottom:14px;margin-bottom:8px;box-shadow:inset 0 -1px 0 var(--line)}
.sets{display:flex;flex-direction:column}
.sets .sw-acts{border-radius:10px}
.sets .sw-row{background:transparent;border-radius:10px}
.sets .sa{width:68px}
.srow{display:grid;grid-template-columns:28px 1fr 30px;align-items:center;gap:8px;padding:0 8px;border-radius:10px;min-height:40px}
.srow.cur{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--text);min-height:44px}
.srow.sel{background:var(--card)}
.srow.head{min-height:22px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scells{display:grid;grid-template-columns:1fr 1fr 52px;gap:8px;align-items:center;border:0;background:none;color:var(--text);text-align:left;padding:0;min-height:38px;font-size:16px;font-variant-numeric:tabular-nums}
.scells .p{font-size:14px;color:var(--muted)}
.scells .cb{border:0;background:none;color:inherit;font:inherit;font-weight:700;text-align:left;padding:0;min-height:38px;width:100%}
.scells .cin{width:100%;min-width:0;border:0;border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:16px;font-weight:700;padding:6px 8px;margin-left:-8px;box-shadow:inset 0 0 0 1.5px var(--accent);outline:none}
.srow.warm .scells{color:var(--muted)}
.snum{border:0;background:none;color:var(--muted);font-size:14px;padding:0;width:28px;height:30px;display:flex;align-items:center;justify-content:flex-start}
.srow.cur .snum{color:var(--text);font-weight:700}
.circle{width:30px;height:30px;padding:0;border:2px solid var(--dim);border-radius:15px;background:transparent;color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.circle.cur{border-color:var(--text)}
.circle.done{border:0;background:var(--accent)}
.circle.wdone{border:0;background:var(--card2);color:var(--text)}
.rp{display:flex;align-items:center;gap:8px;padding:0 8px 0 44px;min-height:24px}
.rp i{flex:1;height:1px;background:var(--line)}
.rp button{border:0;background:none;color:var(--muted);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:0 6px;font-variant-numeric:tabular-nums}
.rp.on i{background:var(--accent);opacity:.6}.rp.on button{color:var(--accent-text)}
.rpe{display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 8px 4px 44px}
.rpe button{border:0;border-radius:9px;min-height:32px;padding:0 10px;background:var(--card2);color:var(--text);font-size:13px;font-weight:700}
.rpe button.v{background:var(--text);color:var(--bg);min-width:56px;font-size:14px}
.editor{background:var(--card);border-radius:22px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;margin-top:auto}
.addbig{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:180px;border:0;border-radius:22px;background:var(--card);color:var(--text);width:100%}
.plusdot{width:56px;height:56px;border-radius:28px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}

/* lists, overview */
.lrow{display:flex;align-items:center;gap:12px;min-height:58px;padding:0 4px}
.lmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;border:0;background:none;color:var(--text);text-align:left;padding:6px 0;font-size:16px}
.stickybar{position:sticky;bottom:12px;margin-top:auto;z-index:3;padding-top:6px}
.stickybar .btn{box-shadow:0 10px 28px rgba(0,0,0,.28)}
.addbtn.on{background:var(--accent);color:var(--on-accent)}
.addbtn{width:40px;height:40px;flex:none;border:0;border-radius:20px;background:var(--card2);color:var(--text);display:flex;align-items:center;justify-content:center}
.ovrow{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 4px 0 12px;border-radius:16px;background:var(--card)}
.ovrow.cur{background:var(--card2)}
@media (prefers-reduced-motion: no-preference){.circle.pop{animation:pop .45s cubic-bezier(.22,1,.36,1)}@keyframes pop{0%{transform:scale(.6);opacity:.4}100%{transform:scale(1);opacity:1}}}
.ovrow.ss{box-shadow:inset 3px 0 0 var(--accent)}
.ovrow .lmain{padding:8px 0}
.handle{width:36px;height:44px;flex:none;border:0;background:none;color:var(--dim);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.chk{width:26px;height:26px;flex:none;border:2px solid var(--dim);border-radius:7px;background:transparent;padding:0;color:var(--on-accent);display:flex;align-items:center;justify-content:center}
